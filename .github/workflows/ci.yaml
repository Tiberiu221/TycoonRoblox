name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-format-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rokit
        run: curl -sSf https://raw.githubusercontent.com/rojo-rbx/rokit/main/scripts/install.sh | bash

      - name: Add Rokit to PATH
        run: echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"

      - name: Install pinned toolchain
        run: rokit install --no-trust-check

      - name: Format check (StyLua)
        run: stylua --check src/ tests/

      - name: Lint (selene, std roblox)
        run: selene src/

      - name: Install Wally packages
        run: wally install

      - name: Unit tests (Lune + frktest)
        run: lune run tests/_run.luau

      # Iese cu eroare daca vreo cumparatura scade venitul, daca o veriga e decor sau daca preturile
      # din config s-au despartit; --robust: aceleasi porti cu fiecare constanta a oamenilor +-15% [D49]
      - name: Economy simulator
        run: python3 scripts/economy/sim_tycoon.py --robust

      # Asezarea randurilor din panouri: cutiile se socotesc din aceleasi constante ca in Luau si
      # pica daca doua se ating. Prima rulare a gasit sase coliziuni pe care nu le prindea nimic.
      - name: Panel row layout
        run: python3 scripts/art/check_panel_rows.py

      - name: Build place
        run: rojo build default.project.json -o Driftwood.rbxl

      # [D60] al doilea place: balciul de seara, cu reteaua lui
      - name: Build fair place
        run: rojo build fair.project.json -o DriftwoodFair.rbxl

      # Caile de require gresite trec de stylua, selene si rojo; se vad abia la rulare
      - name: Check require paths resolve
        run: lune run scripts/check_requires Driftwood.rbxl

      - name: Check require paths resolve (fair)
        run: lune run scripts/check_requires DriftwoodFair.rbxl

      - uses: actions/upload-artifact@v4
        with:
          name: driftwood-build-${{ github.sha }}
          path: |
            Driftwood.rbxl
            DriftwoodFair.rbxl
          retention-days: 90

  publish-staging:
    needs: lint-format-test
    if: github.ref == 'refs/heads/main' && vars.STAGING_UNIVERSE_ID != ''
    runs-on: ubuntu-latest
    concurrency:
      group: driftwood-staging-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Install Rokit
        run: curl -sSf https://raw.githubusercontent.com/rojo-rbx/rokit/main/scripts/install.sh | bash
      - run: echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"
      - run: rokit install --no-trust-check
      - run: wally install
      - name: Build place
        run: rojo build default.project.json -o Driftwood.rbxl

      - name: Build fair place
        run: rojo build fair.project.json -o DriftwoodFair.rbxl

      - name: Publish to Driftwood-Staging (Open Cloud)
        id: publish
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_STAGING_API_KEY }}
        run: |
          RESPONSE=$(curl -sSL --fail \
            --header "x-api-key: $ROBLOX_API_KEY" \
            --header "Content-Type: application/octet-stream" \
            --data-binary "@Driftwood.rbxl" \
            --request POST \
            "https://apis.roblox.com/universes/v1/${{ vars.STAGING_UNIVERSE_ID }}/places/${{ vars.STAGING_PLACE_ID }}/versions?versionType=Published")
          echo "$RESPONSE"
          echo "version=$(echo "$RESPONSE" | jq -r '.versionNumber')" >> "$GITHUB_OUTPUT"

      # [D60] balciul de seara, al doilea place din acelasi univers. Id-ul nu e secret (sta si in PlaceConfig), deci nu
      # mai depinde de o variabila din GitHub: la push-ul f82e404 pasul n-a publicat nimic, iar variabila nu se vedea.
      - name: Publish fair place to Driftwood-Staging (Open Cloud)
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_STAGING_API_KEY }}
          FAIR_PLACE_ID: ${{ vars.FAIR_PLACE_ID || '114983498774894' }}
        run: |
          curl -sSL --fail-with-body \
            --header "x-api-key: $ROBLOX_API_KEY" \
            --header "Content-Type: application/octet-stream" \
            --data-binary "@DriftwoodFair.rbxl" \
            --request POST \
            "https://apis.roblox.com/universes/v1/${{ vars.STAGING_UNIVERSE_ID }}/places/$FAIR_PLACE_ID/versions?versionType=Published"

      - name: Upload artifact tagged with versionNumber
        uses: actions/upload-artifact@v4
        with:
          name: driftwood-staging-v${{ steps.publish.outputs.version }}
          path: |
            Driftwood.rbxl
            DriftwoodFair.rbxl
          retention-days: 90

  # [2026-09-17] Rezultatul fiecarei rulari ajunge pe ramura `ci-status` (status.txt + coada jurnalului pasilor picati).
  # Owner-ul nu gaseste Actions, iar repo-ul privat nu se vede prin API de pe Mac; ramura se citeste prin SSH:
  #   git fetch origin ci-status && git show FETCH_HEAD:status.txt
  report:
    needs: [lint-format-test, publish-staging, smoke-test-staging]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Write the run result to the ci-status branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
          LINT: ${{ needs.lint-format-test.result }}
          PUBLISH: ${{ needs.publish-staging.result }}
          SMOKE: ${{ needs.smoke-test-staging.result }}
        run: |
          work=$(mktemp -d)
          cd "$work"
          git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          if git fetch -q --depth=30 origin ci-status 2>/dev/null; then
            git checkout -q -B ci-status FETCH_HEAD
          else
            git checkout -q --orphan ci-status
          fi
          {
            echo "run: $RUN_ID"
            echo "sha: $SHA"
            echo "finished: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "lint-format-test: $LINT"
            echo "publish-staging: $PUBLISH"
            echo "smoke-test-staging: $SMOKE"
            echo "steps:"
            gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" --jq '.jobs[] | select(.name != "report") | .name as $job | .steps[] | "  \($job) / \(.name): \(.conclusion // .status)"' || echo "  (lista pasilor nu s-a putut citi)"
          } > status.txt
          : > failed.log
          for id in $(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" --jq '.jobs[] | select(.conclusion == "failure") | .id'); do
            echo "=== job $id" >> failed.log
            gh api "repos/$REPO/actions/jobs/$id/logs" 2>&1 | tail -n 150 >> failed.log || true
          done
          git add status.txt failed.log
          git -c user.name="ci" -c user.email="ci@users.noreply.github.com" commit -q -m "CI ${SHA::7}: lint=$LINT publish=$PUBLISH smoke=$SMOKE"
          git push -q origin HEAD:refs/heads/ci-status

  smoke-test-staging:
    needs: publish-staging
    runs-on: ubuntu-latest
    concurrency:
      group: driftwood-luau-execution
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Run smoke tests via Open Cloud Luau Execution
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_LUAU_EXEC_API_KEY }}
          ROBLOX_STAGING_UNIVERSE_ID: ${{ vars.STAGING_UNIVERSE_ID }}
          ROBLOX_STAGING_PLACE_ID: ${{ vars.STAGING_PLACE_ID }}
        run: python scripts/run_cloud_smoke_tests.py
